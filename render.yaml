# Render Blueprint for Atlas AI: backend (free Docker web service) + frontend (free static site).
# The database is an external Neon free-tier PostgreSQL (pgvector included) because Render's
# free PostgreSQL expires after 30 days. See docs/deployment.md for the full procedure.
services:
  - type: web
    name: atlas-ai-backend
    runtime: docker
    plan: free
    # Same region as the Neon database (AWS us-east-1): the agent runs several queries per answer.
    region: virginia
    # Paths are relative to the repository root (Render Blueprint spec).
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health/live
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      # Render terminates TLS at its proxy; trust its forwarded headers for client IPs.
      - key: FORWARDED_ALLOW_IPS
        value: "*"
      # Forward-only, reviewed migrations applied at boot (documented strategy, see docs/deployment.md).
      - key: RUN_MIGRATIONS_ON_START
        value: "true"
      - key: LLM_PROVIDER
        value: groq
      - key: LLM_MODEL
        value: openai/gpt-oss-120b
      - key: EMBEDDING_PROVIDER
        value: nvidia
      - key: EMBEDDING_MODEL
        value: nvidia/nemotron-3.5-embed-1b
      - key: EMBEDDING_DIMENSION
        value: "1024"
      - key: RERANKER_PROVIDER
        value: none
      # Ordered chat fallbacks, one account per provider; OpenRouter entries must be ":free".
      - key: LLM_FALLBACK_CHAIN
        value: '["groq:openai/gpt-oss-20b","gemini:gemini-3.6-flash","openrouter:nvidia/nemotron-3-ultra-550b-a55b:free","openrouter:poolside/laguna-s-2.1:free","nvidia:nvidia/nemotron-3-ultra-550b-a55b"]'
      - key: DB_POOL_SIZE
        value: "3"
      - key: DB_MAX_OVERFLOW
        value: "2"
      - key: JWT_SECRET
        generateValue: true
      # Set these in the Render dashboard (never commit them):
      - key: DATABASE_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: NVIDIA_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: DEMO_SEED_PASSWORD
        sync: false

  # Frontend: free static site. VITE_API_BASE_URL is compiled in at build time, so redeploy
  # the site after changing it.
  - type: web
    name: atlas-ai-frontend
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: ./frontend/dist
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "24"
      # The backend's public URL, e.g. https://atlas-ai-backend.onrender.com (no trailing slash).
      - key: VITE_API_BASE_URL
        sync: false
    routes:
      # SPA: every client-side route serves index.html.
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
